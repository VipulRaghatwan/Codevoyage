server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: codevoyage-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

codevoyage:
  jwt:
    secret: ${JWT_SECRET:super_secret_space_voyage_jwt_signing_key_at_least_256_bits_long_for_security_2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  execution-service:
    url: ${EXECUTION_SERVICE_URL:http://localhost:5050}
    timeout-ms: ${EXECUTION_TIMEOUT_MS:5000}
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/codevoyagedb;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/codevoyage_db}
    username: ${SPRING_DATASOURCE_USERNAME:codevoyage_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:codevoyage_dev_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
